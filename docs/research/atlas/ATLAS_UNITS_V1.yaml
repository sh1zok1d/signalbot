# SIGNALBOT_RESEARCH_ATLAS_V1 — units (hand-maintained source).
#
# One record per research unit (a tested hypothesis, a card, a seed, a frozen experiment).
# Units with `memory: true` take their texts (mechanism, function, what was tested, verdict,
# what it closes, what remains open, rescue warning, anti-rescue scope, blocker) from
# MECHANISM_MEMORY_V0.json and GOVERNANCE_REGION_AUTHORITY_V0.json at build time; those files
# are derived caches of the generator memory chain and are never edited here.
# Every other unit carries its texts itself.
#
# Fields: id, row (REGION.row), col (taxonomy column), state (taxonomy state), datasets
# (ATLAS_SURFACES_V1 ids), period, units_n, practical_bar, verdict, why_closed, reopen,
# forbidden, records, revisit (FUTURE_NATURAL_ACCUMULATION only), note.
version: SIGNALBOT_RESEARCH_ATLAS_V1

# Memory reconciliation. MECHANISM_MEMORY_V0.json is preserved as provenance and history and is never edited.
# memory_status_map turns a frozen memory status into the atlas state it implies (first matching pattern).
# Wherever the atlas state differs, memory_reconciliation records the preserved memory status, the implied
# state, the current atlas state and why; the build fails if an entry is missing, stale or no longer matches
# the memory chain. The atlas is the authority for current routing.
memory_status_map:
  - {pattern: "^PIPELINE_SURVIVOR", state: CANDIDATE_UNTESTED}
  - {pattern: "^PIPELINE_BLOCKED_METHOD", state: BLOCKED_METHOD}
  - {pattern: "^PIPELINE_BLOCKED_DATA", state: BLOCKED_DATA}
  - {pattern: "PROMISING_PROTOTYPE", state: LIVE_SIGNAL}
  - {pattern: "^DEFERRED_(NULL_MODEL|INSUFFICIENT_CONTROL)", state: BLOCKED_METHOD}
  - {pattern: "^BLOCKED|^DEFERRED", state: BLOCKED_DATA}
  - {pattern: "NO_USEFUL_STRUCTURE|NO_EVIDENCE|_KILL\\b", state: NO_STRUCTURE}
  - {pattern: "REJECTED_SPECIFIC_CLAIM|CLOSED_NO_PROMOTION|REPRODUCED_DIRECTION", state: CLOSED_ON_SURFACE}
  - {pattern: "^DEVELOPMENT_CONSUMED", state: EXPOSED_ONLY}
memory_reconciliation:
  - id: D7
    kind: POST_MEMORY_RECORD
    memory_status: PROMISING_PROTOTYPE; adaptive discovery only; NOT independently replicated
    memory_implied_state: LIVE_SIGNAL
    atlas_state: CONFIRMED
    reason: The pre-registered BitMEX 2016-2019 confirmation passed after the memory snapshot (CONFIRMED_UNDER_MAINTAINED_ASSUMPTIONS)
      and the campaign was closed (D7_CAMPAIGN_CLOSED).
    records:
    - docs/research/D7_CONFIRMATORY_PRIMARY_RESULT_V1.md
    - docs/research/D7_CAMPAIGN_CLOSE_V1.md
  - id: GV0V03L40-C033
    kind: POST_MEMORY_RECORD
    memory_status: PIPELINE_SURVIVOR_NO_SCIENTIFIC_STATUS
    memory_implied_state: CANDIDATE_UNTESTED
    atlas_state: BLOCKED_METHOD
    reason: 'The V2 feasibility recompile found that the joint four-part state never occurs in 2020-2024 (MECHANISM_ACTIVE_N
      = 0, alpha unattainable): STOP / NOT_PREREGISTRABLE_UNDER_FROZEN_DESIGN.'
    records:
    - docs/research/GV0V03L40_C033_V2_FEASIBILITY.md
    - docs/research/GV0V03L40_C033_V2_FEASIBILITY.json
  - id: GV0R01-C004
    kind: POST_MEMORY_RECORD
    memory_status: PIPELINE_BLOCKED_DATA_FEASIBILITY_REQUIRED_NO_SCIENTIFIC_STATUS
    memory_implied_state: BLOCKED_DATA
    atlas_state: INFORMATIONALLY_WEAK
    reason: After the Stream-B data acquisition, the card was closed outcome-blind with insufficient inference support.
    records:
    - docs/research/GV0R01_C004_OUTCOME_BLIND_DESIGN.md
    - docs/research/GV0R01_C004_CLOSE.json
  - id: GV0R01-C012
    kind: POST_MEMORY_RECORD
    memory_status: PIPELINE_BLOCKED_DATA_FEASIBILITY_REQUIRED_NO_SCIENTIFIC_STATUS
    memory_implied_state: BLOCKED_DATA
    atlas_state: INFORMATIONALLY_WEAK
    reason: After the Stream-B data acquisition, the card was closed outcome-blind as informationally weak (too few
      events for a verdict either way).
    records:
    - docs/research/GV0R01_C012_OUTCOME_BLIND_DESIGN.md
    - docs/research/GV0R01_C012_CLOSE.json
  - id: GV0R01-C013
    kind: POST_MEMORY_RECORD
    memory_status: PIPELINE_SURVIVOR_NO_SCIENTIFIC_STATUS
    memory_implied_state: CANDIDATE_UNTESTED
    atlas_state: LIVE_SIGNAL
    reason: Executed once after the memory snapshot as a discovery-tier market test; confirmation deferred for low
      power.
    records:
    - docs/research/GV0R01_C013_MARKET_TEST_OUTCOME.md
    - docs/research/GV0R01_C013_CONFIRMATION_FEASIBILITY_AND_DESIGN.md
  - id: GV0R01-C020
    kind: POST_MEMORY_RECORD
    memory_status: PIPELINE_BLOCKED_DATA_FEASIBILITY_REQUIRED_NO_SCIENTIFIC_STATUS
    memory_implied_state: BLOCKED_DATA
    atlas_state: INFORMATIONALLY_WEAK
    reason: After the holiday-calendar pin, the card was closed outcome-blind as an informationally weak reference
      test.
    records:
    - docs/research/GV0R01_C020_OUTCOME_BLIND_DESIGN.md
    - docs/research/GV0R01_C020_CLOSE.json
  - id: H01
    kind: ATLAS_CLASSIFICATION
    memory_status: H01_KILL / REJECTED; 0/5 Batch01 promoted
    memory_implied_state: NO_STRUCTURE
    atlas_state: CLOSED_ON_SURFACE
    reason: The claim was rejected, but the record states a reverse side finding (after quiet 30-120 min, expansion
      was rarer than usual), so the cell is closed on this surface rather than without structure.
    records:
    - docs/research/H01_DEV_SUMMARY.md
  - id: H03
    kind: ATLAS_CLASSIFICATION
    memory_status: H03_REJECTED_SPECIFIC_CLAIM
    memory_implied_state: CLOSED_ON_SURFACE
    atlas_state: NO_STRUCTURE
    reason: The specific claim was rejected and the record shows no steady continuation or fade (the sign changed
      with horizon and year), so the atlas reads it as no structure on this surface.
    records:
    - docs/research/H03_DEV_SUMMARY.md

