# SIGNALBOT_RESEARCH_ATLAS_V1 — data surfaces (hand-maintained source).
#
# Every dataset a unit used or a future card could use, by column. `availability`:
#   PINNED        in the repository with a manifest (docs/research_data) or a product table; usable now
#   ACQUIRABLE    a public archive exists but is not pinned yet (needs a manifest, checksums, point-in-time check)
#   FORWARD_ONLY  only by live / prospective collection from now on
#   BLOCKED       exists but may not be used (frozen collector, unresolved timestamp semantics)
#   NOT_AVAILABLE paid, unpinnable or nonexistent today
# `exposure` lists periods already looked at (`rows`: REGION or REGION.row ids, or scope ALL).
# The E1-RUN-001 holdout [2026-08-16T00:00Z, 2026-08-25T17:20Z) is protected on every surface.
# A dataset with col LENS is a calendar or definition source: it defines rows, it is not a column.
version: SIGNALBOT_RESEARCH_ATLAS_V1

# confirmation_path (0-2): 2 = a time-disjoint era AND a prospective surface exist for the column;
# 1 = only one of them; 0 = neither. A same-period other venue is robustness, not replication
# (HYPOTHESIS_EVALUATION_CONTRACT_V1 §7).
columns:
  CANDLES: {confirmation_path: 2, note: "BitMEX XBTUSD 2016-2019 earlier era; live Binance klines prospective"}
  PERP_FLOW: {confirmation_path: 2, note: "BitMEX volume 2016-2019; live taker split prospective"}
  POSITIONING: {confirmation_path: 1, note: "OI from 2020-09 only; prospective live OI/funding"}
  LIQUIDATIONS: {confirmation_path: 1, note: "live only since 2026-07-17"}
  ORDER_BOOK: {confirmation_path: 1, note: "bookDepth from 2023-01 only; prospective needs a depth collector"}
  SPOT: {confirmation_path: 2, note: "Binance spot archives from 2017 (earlier era) and live spot possible"}
  CROSS_VENUE: {confirmation_path: 1, note: "same-period venues are robustness only; prospective 3-venue Stage-1"}
  CROSS_ASSET: {confirmation_path: 1, note: "panels 2019-12..2024-12; 2025/2026 exposed; prospective only"}
  OPTIONS: {confirmation_path: 1, note: "DVOL from 2021-03; prospective"}
  FLOWS_ONCHAIN: {confirmation_path: 0, note: "nothing pinned"}

datasets:
  # ---- perp price / flow ------------------------------------------------------------------------
  - id: CORE_BTC_BINANCE_V0
    col: CANDLES
    also_cols: [PERP_FLOW]
    venue: Binance USD-M
    instrument: BTCUSDT perpetual
    data: 1m klines (OHLCV, quote volume, trade count, taker-buy volume)
    coverage: "legal 2020-01..2024-12 (bytes to 2026-08-25; the E1 holdout is never read)"
    availability: PINNED
    live_in_product: true
    exposure:
      - {period: 2020-2024, scope: ALL, status: EXPOSED, note: "Historically exposed program surface (H01-H05, B2, D1-D12, MARKET-01/02/05, R03, G01, GV0 cards). Discovery only, with time-disjoint replication."}
      - {period: 2020-2024, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "DH1-L2 one-shot discovery (confluent vs lone level -> 4h hold), 2026-10-04"}
      - {period: 2020-2024, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-TOUCH-DEGRADATION-V1 one-shot (independent touch ordinal of ex-ante PDH/PDL/PWH/PWL/PMH/PML -> 4h BREAK_FIRST), 2026-10-07; outcomes read on a surface already consumed by DH1-L2; not a confirmation"}
      - {period: 2020-2024, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-REJECTION-MEMORY-V1 one-shot (prior REJECT_FIRST speed -> next independent touch 4h BREAK_FIRST), 2026-10-07; further exposure of the same level row, not a confirmation of LEVEL-TOUCH-DEGRADATION-V1"}
      - {period: 2020-2024, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-APPROACH-STATE-DISCOVERY-V1 one-shot (price-only approach state -> 4h BREAK/REJECT/NEITHER), 2026-10-07; OHLC plus quote volume; further exposure of the same level row, not a confirmation of LEVEL-TOUCH-DEGRADATION-V1 or LEVEL-REJECTION-MEMORY-V1"}
      - {period: 2020-2024, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-STRUCTURE-DISCOVERY-V1 one-shot (structural metadata -> 4h BREAK/REJECT/NEITHER, real minus rotated price), 2026-10-07; OHLC plus source-period quote volume; further exposure of the same level row, not a confirmation of LEVEL-TOUCH-DEGRADATION-V1, LEVEL-REJECTION-MEMORY-V1 or LEVEL-APPROACH-STATE-DISCOVERY-V1"}
      - {period: 2020-09..2024-12, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-POSITIONING-FLOW-DISCOVERY-V1 one-shot (pre-touch taker quote imbalance and OI change -> first-touch RESOLVE_4H and BREAK_GIVEN_RESOLVED), 2026-10-07; quote volume and taker-buy quote on complete bars ending at or before T; further exposure of the same level row, not a confirmation"}
      - {period: 2020-09..2024-12, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-FLOW-RESPONSE-STATE-DISCOVERY-V1 one-shot (outcome-blind joint state of OI, taker flow and approach-oriented price progress -> first-touch resolution), 2026-10-07; further exposure, not a confirmation and not a reopen of FLOW.absorption"}
      - {period: 2023-01-01T02:00Z..2024-12-31, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-LIQUIDITY-STATE-DISCOVERY-V1 one-shot (local ±1% book state immediately before a structural first touch -> RESOLVE_4H and BREAK_GIVEN_RESOLVED), 2026-10-07; further exposure of the level row, discovery only, not a confirmation"}
      - {period: 2020-09-01T00:05Z..2024-12-31, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-POST-TOUCH-REACTION-DISCOVERY-V1 one-shot (15m post-touch price, activity and taker reaction on events still unresolved at T+15m -> remaining 4h barrier passage), 2026-10-07; further exposure, not a confirmation and not a reopen of PRICE_STRUCTURE.breakout"}
      - {period: 2020-02-01T00:00Z..2024-12-31, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-ACCEPTANCE-PATH-DISCOVERY-V1 one-shot (15m close-path memory conditional on END_POSITION_X, among structural first touches still unresolved at T+15m -> remaining 4h BREAK vs REJECT), 2026-10-08; price OHLC only; further exposure, not a confirmation and not a reopen of PRICE_STRUCTURE.breakout"}
      - {period: 2020-04-01T00:05Z..2024-12-31, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-CROSS-VENUE-REACTION-DISCOVERY-V1 one-shot (other linear-perpetual 15m reaction conditional on END_POSITION_X, among structural first touches still unresolved at T+15m -> remaining 4h BREAK vs REJECT), 2026-10-08; Binance OHLC is the structural reference only; further exposure, not a confirmation and not a reopen of MARKET-06 or CROSS_VENUE_REGION.venue_disagreement"}
      - {period: 2020-04-01T00:05Z..2024-12-31, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-SPOT-PERP-REACTION-DISCOVERY-V1 one-shot (Binance spot 15m reaction conditional on END_POSITION_X and the other-perp median move, among structural first touches still unresolved at T+15m -> remaining 4h BREAK vs REJECT), 2026-10-08; Binance OHLC and taker-buy quote on the three reaction bars; further exposure, not a confirmation and not a reopen of SPOT_PERP.spot_confirmation"}
      - {period: 2020-02-01..2024-12-31, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-TIME-TO-RESOLUTION-DISCOVERY-V1 one-shot (time from a structural first touch to the first BREAK, REJECT, or AMBIGUOUS barrier bar, real versus half-rotation pseudo, restricted mean unresolved time over 240m), 2026-10-08; price OHLC only; further exposure, not a confirmation of the BitMEX resolution rate and not a reopen of GV0R01-C024"}
      - {period: 2020-02-01..2024-12-31, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-BREAK-REJECT-SEQUENCE-DISCOVERY-V1 one-shot (after the first one-sided #352 barrier, whether the opposite barrier is reached inside the same 4h event, real versus half-rotation pseudo), 2026-10-08; price OHLC only; first-event labels were already exposed; further exposure, not a confirmation and not a reopen of H02 or PRICE_STRUCTURE.breakout"}
