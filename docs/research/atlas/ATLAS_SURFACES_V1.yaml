# ---- reserved confirmation surfaces ----------------------------------------------------------------
# A reserved surface is invisible to exploratory outcome generation (a dataset held whole is left out of
# the generator view; a held period appears there only as an unavailable period), cannot be consumed
# without an explicit permit, records the region/cells and the intended confirmation use, and stays
# reserved if feasibility fails before its outcomes are opened. Status: RESERVED | RELEASED | CONSUMED.
# Only surfaces already reserved by a record are listed here; adding one needs an owner decision.
reservations:
  - id: E1_RUN_001_FINAL_HOLDOUT
    status: RESERVED
    # every atlas dataset whose coverage (or stored bytes) includes the period
    datasets: [CORE_BTC_BINANCE_V0, BINANCE_UM_KLINES_5M_PRODUCT, BINANCE_UM_TRADES_AGGTRADES_ARCHIVE, BINANCE_UM_OI_METRICS_PRODUCT,
               BINANCE_UM_PREMIUM_MARK_INDEX_KLINES, STAGE1_LIVE_OI_FUNDING, STAGE1_LIVE_LIQUIDATIONS, STAGE1_LIVE_KLINES_3VENUE,
               BINANCE_UM_BOOKDEPTH_ARCHIVE, OKX_OFFICIAL_ARCHIVES, BINANCE_SPOT_KLINES_ARCHIVE, BYBIT_BTCUSDT_PUBLIC_HISTORY,
               DERIBIT_DVOL_API, BINANCE_OPTIONS_BVOL]
    period: {start: "2026-08-16T00:00:00Z", end_exclusive: "2026-08-25T17:20:00Z"}
    scope: {regions: [METHOD], cells: ["METHOD.composition|CANDLES"], note: "every BTC market row in the period, on every venue and archive"}
    intended_use: "E1-RUN-001 final chronological holdout: one open by the frozen one-shot evaluator after the timestamp-only coverage gate passes, or an explicit close as technically incomplete"
    holder_units: [E1-RUN-001]
    permit_required: true
    permit: null
    authority: [AGENTS.md, docs/e1/E1_RUN_001_FINAL_HOLDOUT_EVALUATOR_FREEZE.md, docs/e1/E1_RUN_001_PRE_HOLDOUT_FREEZE.md]
    # pristine_status records whether the reserved slice is still unread; a non-PRISTINE status names what opened it.
    pristine_status: INVALIDATED_FOR_P4_OVERLAP
    contamination:
      - {by: "P4 owner-run descriptive follow-up (2026-09-29)", period: {start: "2026-08-16T00:00:00Z", end_exclusive: "2026-08-25T17:20:00Z"},
         tables: [klines_1m, open_interest], evaluator_touched: false, sealed_artifacts_opened: false,
         decided: "owner, 2026-10-03", record: docs/research/PRICE_OI_INCREMENTAL_INFORMATION_PILOT_V0_E1_OVERLAP_ERRATUM.md}
    note: "The product history sync never requests an archive object overlapping this period; the divergence program read horizon stops at 2026-08-15."
