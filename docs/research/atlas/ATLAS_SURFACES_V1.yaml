      - {period: 2020-02-01..2024-12-31, rows: [PRICE_STRUCTURE.levels], status: CONSUMED, note: "LEVEL-VOLATILITY-TRANSITION-DISCOVERY-V1 one-shot (paired log ratio of 60m realized volatility after versus before a structural first touch, real versus half-rotation pseudo, touch bar excluded), 2026-10-08; price closes only; further exposure, not a confirmation and not a reopen of H01, B2-01, or DH3-V2"}
