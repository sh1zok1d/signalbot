  # ------------------------------------------------------------------ DISCOVERY D1-D13 (2026-09-21..22)
  D1:
    records: [docs/research/DISCOVERY_SPRINT_01_D1_NULL_ADEQUACY_GATE.md]
    cat: FLAWED_ESTIMAND_DESIGN
