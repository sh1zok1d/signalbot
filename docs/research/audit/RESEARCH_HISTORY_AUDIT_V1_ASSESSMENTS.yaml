    assess: "Replicated on an independent pre-2020 surface. The excess-alignment decomposition found it volatility-scale compatible, so it is \"high RV -> bigger adverse paths\", a scaling fact. RULE_2 (dislocation abstention) failed discovery. Child records: D2_BITMEX_REPLICATION (first run INVALID, corrected run SUPPORTED) and D2_EXCESS_DIRECTION_ALIGNED_PATH_RISK."
