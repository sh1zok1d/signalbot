# RESEARCH_HISTORY_AUDIT_V1 — per-unit independent assessments (hand-written source).
#
# This file holds the audit's judgments. Facts (title, data, N, official verdict, why closed, records)
# come from the atlas at build time; numbers quoted here are copied from the cited result records.
# Nothing here changes an official verdict: `official` stays whatever the sealed record says.
#
# Build: python -m scripts.research.history_audit  (writes RESEARCH_HISTORY_AUDIT_V1.json and _TABLE.md)
#
# Fields
#   cat    primary category (CATEGORIES below); cat2 optional second category when one does not fit
#   cons   did over-conservatism of the old framework substantially drive the decision?
#          YES      the decision came from a framework rule, not from the data (data showed an effect or the
#                   information was there)
#          PARTLY   a framework rule was one of the deciding reasons; the data alone were also weak
#          NO       the data (or a correctness / provenance fact) decided it
#          NA       no evidential decision was taken (idea never tested, not selected, owner routing)
#   level  maximum claim the existing evidence justifies today (EVIDENCE_AND_CLAIMS_DECISION_V1 ladder)
#   needs  NONE | PROSPECTIVE | NEW_DATA | REDESIGN | NOT_RECOVERABLE | OWNER_DECISION (may combine with +)
#   est / unc / stab   estimate, uncertainty, stability as recorded (executed units only)
#   assess independent assessment today

categories:
  REAL_NULL: tested with enough information; the estimate is near zero or the interval excludes a meaningful effect
  STRONG_NEGATIVE: tested; the claimed effect is reversed or the feature clearly makes forecasts worse
  INSUFFICIENT_INFORMATION: tested; the interval is too wide to say either way
  BLOCKED_FEASIBILITY_MDE: closed before any outcome because the minimum detectable effect exceeded the bar
  BLOCKED_PRACTICAL_BAR: tested; a non-zero effect (interval excludes zero) was closed by a fixed magnitude bar
  CERTIFICATION_MACHINERY: methodology / variance / certification apparatus, not a market hypothesis
  INFERENCE_LIMITATION: decided by a multiple-testing, conjunction-gate or inference-resolution rule
  DATA_PROVENANCE_PIT: blocked or impaired by data availability, provenance or point-in-time semantics
  FLAWED_ESTIMAND_DESIGN: the estimand or design could not answer the question (degenerate state, wrong null)
  EXPOSED_POTENTIALLY_USEFUL: data were looked at outside a confirmatory test; usable descriptively, not confirmable on the same data
  POSITIVE_ALIVE: discovery / replicated / confirmed effect that is still standing
  NOT_TESTED_METHOD_BLOCK: idea stopped before any measurement by a method critic (identification, confounding, lookahead)
  NOT_TESTED_ANTI_RESCUE: idea stopped before any measurement as a neighbour, relabel or rescue of a closed unit
  NOT_TESTED_NOT_SELECTED: idea never selected, or its line closed by owner routing, before any measurement
  GOVERNANCE_BLOCKED: defined unit that may not run under a protected-surface rule
  PRODUCT_EVIDENCE: product statistic or product-safety track, not a research hypothesis

# Group defaults for idea-stage generator cards, keyed on the blocker named in the official verdict.
generator_defaults:
  METHOD_LOOKAHEAD_VIOLATION:
    cat: NOT_TESTED_METHOD_BLOCK
    cons: "NO"
    level: L0
    needs: REDESIGN
    assess: "Idea-stage card. The critics found a no-lookahead defect in the card's own construction, which is a correctness block. Nothing was measured, so there is no evidence either way."
  METHOD_CAUSAL_IDENTIFICATION_AND_CONFOUNDING:
    cat: NOT_TESTED_METHOD_BLOCK
    cons: NA
    flag: STANDARD_MISMATCH_POSSIBLE
    level: L0
    needs: REDESIGN
    assess: "Idea-stage card blocked by a causal-identification standard. That standard is right for a mechanism or edge claim, but a descriptive L1/L2 question on the same observable would not need it. No estimate exists, so no effect can be said to have been lost."
  METHOD_CONFOUNDING_CONTROL_INADEQUATE:
    cat: NOT_TESTED_METHOD_BLOCK
    cons: NA
    flag: STANDARD_MISMATCH_POSSIBLE
    level: L0
    needs: REDESIGN
    assess: "Idea-stage card blocked for inadequate confounding control. That is right for a mechanism claim, but stricter than an L1/L2 descriptive line needs. No estimate exists."
  DATA_FEASIBILITY_REQUIRED:
    cat: DATA_PROVENANCE_PIT
    cons: "NO"
    level: L0
    needs: NEW_DATA
    assess: "Idea-stage card waiting on a data-feasibility pass that was never done. Nothing was measured."
  DATA_BLOCKED_POINT_IN_TIME_SEMANTICS:
    cat: DATA_PROVENANCE_PIT
    cons: "NO"
    level: L0
    needs: NEW_DATA
    assess: "Idea-stage card. Point-in-time semantics of the source are unproven, so any test would risk lookahead. A legitimate block."
  DATA_BLOCKED_PROVENANCE:
    cat: DATA_PROVENANCE_PIT
    cons: "NO"
    level: L0
    needs: NEW_DATA
    assess: "Idea-stage card. The source has no provable provenance. A legitimate block."
  DATA_STATUS_DISAGREEMENT_REQUIRES_HUMAN_REVIEW:
    cat: DATA_PROVENANCE_PIT
    cons: "NO"
    level: L0
    needs: NEW_DATA
    assess: "Idea-stage card. Critics disagreed on data status and no human review followed. Nothing was measured."
  SURVIVOR:
    cat: NOT_TESTED_NOT_SELECTED
    cons: NA
    level: L0
    needs: OWNER_DECISION
    assess: "Passed the generator's critics but was never selected for feasibility or a test. No evidence either way."

units:
  # ------------------------------------------------------------------ BATCH01 (2026-08-26/27)
  H01:
    cat: STRONG_NEGATIVE
    cons: "NO"
    level: L2
    needs: NONE
    est: "compression predicted LOWER future realized volatility; decile order vs future RV Spearman 1.0 in the reverse direction"
    unc: "every week-block bootstrap CI negative on the primary difference"
    stab: "all 45 cells x 5 years = 225 year-blocks negative"
    assess: "The claim (compression -> expansion) is clearly refuted; the data show the opposite, i.e. volatility persistence. That reverse side is a known stylized fact and an honest L2 descriptive line (\"after a quiet 30-120 min, expansion in 2-7 % of cases vs about 25 % usually\"), already a SIDE_FINDING in the bot."
  H02:
    cat: STRONG_NEGATIVE
    cons: "NO"
    level: L2
    needs: NONE
    est: "failed-minus-successful breakout reversion -0.07 to -0.15 (normalized) in 44/45 cells"
    unc: "10/45 cells with an entirely positive bootstrap CI on the raw bounce, but the mechanism contrast fails"
    stab: "a short-horizon s=0 H=15 bounce is positive in 5/5 years, post-hoc"
    assess: "The mechanism-specific contrast (closing back inside vs a successful breakout) goes the wrong way in almost every cell. That is a real negative for the failed-breakout mechanism. The short-horizon boundary bounce is generic and post-hoc."
  H03:
    cat: REAL_NULL
    cons: "NO"
    level: L2
    needs: NONE
    est: "continuation MPIE 3/45 and exhaustion MPIE 11/45 isolated cells; signs flip between neighbouring q and H"
    unc: "dependence L_dep 32 days; n_eff_h 180-2880 by horizon"
    stab: "no year-stable sign; 2023 often the most negative year"
    assess: "A genuine null. The sign is unstable across horizon, threshold and year, which is not a conservatism artefact. The bot line (\"neither a steady continuation nor a fade\") matches the record."
  H04:
    cat: INFERENCE_LIMITATION
    cat2: EXPOSED_POTENTIALLY_USEFUL
    cons: PARTLY
    level: L1
    needs: NEW_DATA
    est: "means positive in 34/45 cells; MPIE (dMat >= 0.10) 16/45; all three gates 10/45, concentrated in the moderate depth band at L=480/960"
    unc: "L=960 moderate H=15/30 and L=480 moderate H=15 have 1w/2w/4w bootstrap CIs entirely positive; most other MPIE cells include 0"
    stab: "L=960 moderate H=15/30/240 positive in 5/5 years; the 45-cell surface is not 4/5-year stable"
    assess: "The continuation signal exists in one depth band and was rejected mainly by the neighbourhood rule (two adjacent depth bands, both directions) and the conjunction of gates, applied after a 45-cell search. Its explicit child B2-04 measured a different estimand (RECOVERY_FRACTION added to an MAE model) and was negative, so the moderate-band pattern itself was never tested on fresh data. It is post-hoc on exposed 2020-2024 data. Only a pre-2020 or prospective surface can test it."
  H05:
    cat: BLOCKED_PRACTICAL_BAR
    cat2: INFERENCE_LIMITATION
    cons: PARTLY
    level: L1
    needs: NEW_DATA
    est: "reversal after SELL-side taker imbalance in 45/45 cells (oriented primary); matched-random delta at most 0.052 (MPIE bar 0.10); structural delta at most 0.046 (bar 0.05)"
    unc: "bootstrap 1w/2w pass 8/45, 4w 7/45 (reversal); 0/45 for continuation"
    stab: "reversal year gate 22/45; BUY side mostly not reversing (8/45)"
    assess: "There is a consistent, small, one-sided effect (selling imbalance is followed by a slight reversal), not a symmetric mechanism. It failed a magnitude bar and a nine-way gate conjunction, and the effect is small enough that the product value is doubtful. The bot text \"no steady continuation or reversal\" is broader than the record, which shows a consistent small SELL-side reversal; recorded as a methodology finding, not edited here."
  # ------------------------------------------------------------------ BATCH02 (2026-09-02..07)
  B2-01:
    records: [docs/research/B2_01_VOLATILITY_TRANSITION_RESULT.md]
    cat: REAL_NULL
    cons: "NO"
    level: L1
    needs: NONE
    est: "relative MAE improvement +0.23 % to +0.62 % in the W=60 cells (bootstrap positive), negative in the W=120 cells; materiality bar 2 %"
    unc: "W=60 bootstrap CIs exclude 0; W=120 CIs mostly exclude 0 on the negative side"
    stab: "W=60 cells positive in 2020-2022; 7 of 8 negative in 2023-2024 (W=60 D=120 H=30 stayed slightly positive, the only year-stable cell)"
    assess: "A real but negligible improvement (at most 0.62 % vs a 2 % bar) that faded and turned negative in 2023-2024 in 7 of the 8 W=60 cells. Any sensible bar would reject it, so the 2 % bar was not the deciding factor."
