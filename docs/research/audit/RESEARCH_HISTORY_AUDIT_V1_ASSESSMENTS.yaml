    assess: "The official word NO_USEFUL_STRUCTURE was given only because of a fixed 15 % bar; the statistical and temporal gates passed for all three functionals. Realized 24h excursions are about 11-13 % smaller than a block-shuffled path predicts, which is mild intraday mean reversion. As L1 descriptive context this is honest. Product value is low, because the product corridor is already fitted empirically and absorbs it."
