known_limitations:
  - Binance USD-M BTCUSDT only.
  - 1m official kline archive only.
  - Archive evidence is HISTORICAL_COMPARABLE / OFFICIAL_ARCHIVE, not LIVE_EQUIVALENT.
  - No open interest.
  - No funding.
  - No liquidations.
  - No order book.
  - No Bybit / OKX.
  - Price/volume analytical columns are canonical decimal strings and must be parsed numerically before comparison, sorting, arithmetic, or aggregation.
  - Snapshot cutoff is fixed at 2026-08-26T00:00:00Z; extending history creates another snapshot/revision.
  - Discovery authorization is not confirmatory authorization.
  - 24 monthly ZIP CSV members have no header; parser status was OK for all 104 objects.

notes:
  - >-
    Source URL/path is not sufficient identity because Binance documents that
    archived files can be revised. Freeze source checksum and local SHA-256.
  - >-
    Non-zero gaps do not automatically invalidate the whole dataset, but they
    must be explicit and affected higher-timeframe buckets must fail closed.
    This accepted snapshot observed 0 missing minutes and 0 incomplete HTF buckets.
  - >-
    ACCEPTED_FOR_DISCOVERY is not an edge claim and is not ACCEPTED_FOR_CONFIRMATORY.
  - >-
    Operational discovery research also requires the materializer implementation
    commit 71d13afdae4456163316b850f340436af1eeed65 to be remotely preserved.
