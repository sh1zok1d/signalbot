[pytest]
# Collect ONLY the tests/ tree. This deliberately excludes scripts/test_shutdown.py,
# which runs a real backfill against live exchange APIs and is a manual/networked
# test — never part of the automated suite (run it by path, on purpose).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support is available (pytest-asyncio) but kept STRICT, so the current
# synchronous suite is untouched; async tests must opt in with @pytest.mark.asyncio.
asyncio_mode = strict

# Registered markers (use `-m` to select / deselect). Not every existing test is
# tagged yet — tagging is left to the QA engineer as they add coverage.
markers =
    unit: fast, pure, no I/O — the default kind and what qa-fast runs
    integration: needs the test TimescaleDB/Redis from docker-compose.test.yml
    regression: pins a fixed bug; must fail before the fix and pass after
    contract: asserts a frozen data/behaviour contract (e.g. Stage 2 0.2.3)
    slow: noticeably slow; may be deselected in the fast loop
    manual: run by hand only (external network / real services); never in CI

addopts = -ra
