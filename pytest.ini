[pytest]
# Several research tests make a disposable `git clone` of the whole repository
# (about 400 MB checked out) in their tmp_path. Keeping every passing test's
# tmp_path until the session ends filled the CI runner's disk and failed
# unrelated tests. Delete a passing test's tmp_path when the test ends; keep a
# failing test's for inspection.
tmp_path_retention_policy = failed
