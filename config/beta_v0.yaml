# Signalbot PRIVATE BETA V0.2 — descriptive attention engine configuration.
#
# Authority: docs/PRIVATE_BETA_V0_RESTART_DECISION.md. Loaded ONLY by
# beta/config.py. Stage-1 config/config.yaml and Stage-2 config/stage2.yaml are
# not touched. Every event threshold, persistence duration, TTL, cooldown and
# product cap lives here — never as a hidden Python literal.
#
# Secrets (bot token, owner Telegram user id) come from the environment only
# (BETA_TELEGRAM_BOT_TOKEN / BETA_OWNER_TELEGRAM_USER_ID), never from this file.
#
# Hard switches: each runtime switch is effective only when BOTH this file AND
# its environment kill switch allow it (BETA_ENABLED, BETA_DETECTION_ENABLED,
# BETA_PUSH_ENABLED, BETA_OUTCOME_TRACKING_ENABLED). BETA_PUSH_ENABLED must be
# set explicitly to a true value; an unset push env var forbids push. The owner
# /admin_pause_push / /admin_resume_push durable state can only further
# restrict push — it can never exceed these hard switches.

beta:
  enabled: false
  detection_enabled: true
  push_enabled: true
  outcome_tracking_enabled: true

  rules_version: BETA_EVENT_RULES_V1
  state_schema_version: 2                  # V2 = V1 + per-venue raw values / kline OHLC (temporal context)
  outcome_version: BETA_OUTCOME_V1

  symbol: BTCUSDT
  market_type: perp
  timeframe: 5m
  active_exchanges: [binance, bybit, okx]   # Bitget stays disabled

  percentile_window: 30d
  min_venue_coverage: 2                     # per-family usable venues required

  max_state_age_s: 420                      # NO ACTIVE EVENTS fail-closed age
  bucket_close_grace_s: 20                  # wait after 5m close before evaluating
  same_event_cooldown_min: 20               # same-event PUSH cooldown after terminal
  delivery_ttl_s: 600                       # never push older than this
  max_new_pushes_per_utc_day: 2             # per recipient, their own day (PRODUCT_FIRST §3 row 8; review of #373)
  push_decisions_fuse_per_utc_day: 4        # all recipients together: safety fuse set by ОПГ-1; the architect may change it
  forward_horizons: [15m, 30m, 1h, 4h, 24h]

  detector:
    max_catchup_buckets_per_run: 12         # bounded catch-up; beyond => DETECTION_GAP

  bootstrap:
    lookback_days: 30                       # max history the 30d percentiles need
    max_buckets_per_run: 288                # bounded per invocation (1 day)

  ingestion:
    heartbeat_max_age_s: 180                # newest live 1m kline per venue
    min_healthy_venues: 2

  outcomes:
    max_jobs_per_run: 50
    incomplete_after_h: 48                  # still-incomplete window => INCOMPLETE_DATA
    recheck_window_h: 48                    # completed outcomes re-verified for corrections

  notifications:
    max_deliveries_per_run: 100
    # A5: at most one send per 50 ms (Telegram allows about 30 messages a second per bot) and
    # no send started after 20 s of the process (the unit is stopped at 50 s; one send can take
    # 17 s and the run's tail 8 s: beta.config.NOTIFY_BUDGET_MAX_S); the rest waits PENDING
    send_interval_ms: 50
    send_budget_s: 20

  privacy:
    stopped_user_retention_days: 30

  health:
    detector_stall_s: 900
    outcome_stall_s: 3600
    bot_stall_s: 300
    notifier_stall_s: 600
    delivery_problem_window_s: 3600
    delivery_problem_threshold: 3
    owner_alert_repeat_s: 1800

  rules:
    PRICE_OI_CONTRACTION_DOWN:
      price_move_pct_median_max: 0.05
      oi_change_pct_median_max: 0.10
      armed_at_streak: 1
      triggered_at_streak: 2
    PRICE_OI_CONTRACTION_UP:
      price_move_pct_median_min: 0.95
      oi_change_pct_median_max: 0.10
      armed_at_streak: 1
      triggered_at_streak: 2
    POSITION_BUILDUP_COMPRESSION:
      range_width_pct_median_max: 0.40
      oi_change_pct_median_min: 0.80
      volume_notional_usd_sum_min: 0.50
      early_at_streak: 3
      armed_at_streak: 6
      triggered_at_streak: 9
      max_duration_min: 180
    TAKER_FLOW_EXTREME:                     # gated optional (30d-mature, >=2 venues)
      enabled: true
      buy_percentile_min: 0.95
      sell_percentile_max: 0.05
      armed_at_streak: 1
      triggered_at_streak: 2
    LIQUIDATION_STRESS:                     # gated optional (per-venue mature votes)
      enabled: true
      venue_percentile_min: 0.95
      min_eligible_venues: 2
      triggered_at_streak: 1
  # ---- temporal context (/btc) — NOT part of the rules digest --------------
  # Deterministic projection of the 5m state tape. The ACTIVE episodization keeps
  # the detector's own episode boundaries exactly (STRICT_QUALIFICATION_V1): no
  # hysteresis, no COOLING, no invented persistence. Hysteresis parameters are
  # UNFROZEN (no historical detector tape) and must not reach /btc, pushes,
  # outcomes or episode identity; live hysteresis cannot be enabled here.
  # Any change requires a NEW version label (the label -> digest pins live in
  # beta/context.py).
  episodization:
    version: STRICT_QUALIFICATION_V1
    live_hysteresis_enabled: false
  context:
    version: BETA_CONTEXT_1H_V3             # V3 (C1): range/move/volume ranked against the same UTC day type; V2: + 4h, taker, OI
    rolling_buckets: 12                     # rolling 1h = last 12 closed 5m buckets
    rolling_buckets_4h: 48                  # rolling 4h = last 48 closed 5m buckets (same machinery)
    label_elevated: 0.80                    # percentile-rank labels (unsigned dims)
    label_high: 0.95
    label_extreme: 0.99
    tail_display_max: 0.20                  # signed values: show "top/bottom X%" only within this tail
    last_event_retention_min: 120           # LAST EVENT stays on /btc this long after it ended (presentation)
  # Presentation only ("Changes vs previous 24h"). Not detection, not the rules digest.
  horizon_changes:
    version: BETA_HORIZON_CHANGES_V1
    range_wider_ratio: 1.5
    range_narrower_ratio: 0.67
    volume_higher_ratio: 1.5
    volume_lower_ratio: 0.67
    oi_abs_pct_min: 1.0
    price_abs_pct_min: 1.0
  # Join cap. Not detection, not the rules digest. The owner is exempt.
  access:
    max_active_users: 20
    # Monetization readiness (PRE_BETA_SCOPE_DECISION_V1 §6.5, backlog I1): free / paid flags exist in
    # code and nothing is gated during the beta. No payment processing anywhere.
    tiers_enforced: false
    # U3 (PRODUCT_FIRST_DECISION_V1 §7, backlog I2): the offer /admin_offer sends on days 21–25 to every
    # enrolled participant, churned included. The owner fixes the price and the manual method in a
    # commit before Day 0; while either is empty the command refuses. No tariff page (post-beta).
    u3_offer:
      price: null                         # e.g. "$15 в месяц / $15 a month"
      method: null                        # the manual transfer the owner accepts
    # The owner's UX preview (2026-10-09): every automated message (pushes, market alerts, sharp moves,
    # CPI/FOMC notices, briefings, the weekly report) reaches only the owner; anyone else's row is
    # SUPPRESSED / SUPPRESSED_PREVIEW, terminal. Decisions, the claim journal, fuses and limits run as
    # usual. Replies to a participant's own commands and the owner's /admin_reply, /admin_broadcast pass.
    preview_owner_only: true
  # Per-user activity retention (beta plus 90 days). Not the rules digest.
  # Rejected /start rows (hashes or a daily count) are purged separately.
  telemetry:
    retention_days: 120
    rejected_start_retention_days: 30
  # /feedback limits. Presentation only. Not detection, not the rules digest.
  feedback:
    max_chars: 1000
    max_per_utc_day: 5
  # D7 "High impact" line on /btc. Display only. Not detection, not the rules digest.
  # This committed flag is the hard allow. The line also needs the durable owner
  # state (/admin_d7_on), which defaults off and can never exceed this switch.
  # Morning briefing (PRODUCT_FIRST_DECISION_V1 §3 row 3). Same view and render path
  # as /catchup, delivered by the existing notifier through the existing outbox.
  # Not detection, not the rules digest. Committed ON since PRODUCT_DECISION_V2 (owner, 2026-10-03);
  # it also needs the global push switches (BETA_PUSH_ENABLED, no /admin_pause_push).
  briefing:
    enabled: true                           # PRODUCT_DECISION_V2: the briefing carries corridor, levels, events
    time_kyiv: "08:00"
    max_delay_min: 120                      # a brief not sent within this is expired, never late
    # U1a withdrawal test (BETA_MEASUREMENT_CONTRACT_V1 §6), frozen before Day 0: the briefing is
    # withheld for everyone on `count` weekdays drawn with `seed` from cohort days
    # first..last (weeks 3-4). Only day0_kyiv is set, once, when Day 0 happens.
    withdrawal:
      day0_kyiv: null                       # "YYYY-MM-DD" (Kyiv) once Day 0 is declared; null = off
      seed: 20261003
      count: 3
      first_cohort_day: 14
      last_cohort_day: 27
  regime_d7:
    enabled: true
  # OKX liquidations (decision (d), 2026-10-09; docs/BETA_OKX_LATE_ARRIVAL_IMPACT.md): OKX's liquidation
  # events arrive up to hours late, after their 5m bucket is materialized. false = OKX liquidation
  # amounts are never shown and OKX never votes in LIQUIDATION_STRESS, whatever its percentile
  # maturity (no automatic enable). OKX price, OI, volume and funding are not affected.
  liquidations:
    okx_enabled: false
  # Pulsy UX V2 (docs/PULSY_UX_STANDARD_V2.md): the three-level render (beta/ux). P0 is wired to no
  # surface; true only after the owner's go. Presentation only: not detection, not the rules digest.
  ux:
    v2_enabled: false
  # Delivery-side push policy (PRODUCT_FIRST_DECISION_V1 §3 row 8). Policy only: it
  # enters the config digest, never the rules digest. The unusual-hour gate itself
  # reuses context.label_high and has no key of its own (§3.1b).
  push_policy:
    quiet_hours_kyiv: ["23:00", "07:00"]    # no event push between these Kyiv wall-clock times
    global_cooldown_min: 60                 # one push per hour across every event type
  # Decision support (PRODUCT_DECISION_V2, 2026-10-03): corridor, levels, «после похожих»,
  # events, /risk, /alert, market alerts. Presentation and market-alert policy only; not
  # detection, not the rules digest. Market alerts go through the existing outbox.
  decision:
    max_price_alerts: 5                     # personal /alert levels per participant
    forecast_tracking: true                 # record each hour's corridors and their outcome (/accuracy)
    claim_journal: true                     # journal every L2/L3 claim hourly and at alert evaluation, score it
                                            # (docs/BETA_CLAIM_JOURNAL_DESIGN_V1.md); internal tracking only
    signature_index: true                   # owner-only /hypotheses index (PRE_BETA_SCOPE_DECISION_V1 §7);
                                            # signs every closed 5m bucket from stored states, no user surface
    # weekly report (backlog B4): how the bot's own estimates did over 7 days; a push type of its
    # own (/push weekly off). Sunday evening on each participant's own clock, so never on a U1a
    # withdrawal weekday (Mon-Fri) on their clock (review of #379).
    weekly_report:
      enabled: true
      weekday_kyiv: "sun"
      time_kyiv: "19:00"
      max_delay_min: 120                    # not sent within this: expired, never late
    market_alerts:
      enabled: true                         # also needs BETA_PUSH_ENABLED and no /admin_pause_push
      max_per_utc_day: 4                    # level touches and sharp moves together, per recipient, their own day
      decisions_fuse_per_utc_day: 8         # all recipients together: safety fuse set by ОПГ-1; the architect may change it
      move_cooldown_min: 120                # one sharp-move message per 2h
      event_lead_min: 30                    # CPI / FOMC reminder this long before the release
      touch_max_age_min: 10                 # a level touch older than this is not pushed (missed run)
    # Research evidence (owner task 2026-10-04): the bot recognises the live states of closed research
    # units and states what they found (docs/research/RESEARCH_EVIDENCE_INTEGRATION_V1.md). Text only:
    # never detection, push gating, corridors or touch probabilities. The feeds are public read-only
    # market data (Binance futures data/depth/aggTrades, Binance spot market data, Deribit DVOL).
    research_evidence:
      enabled: true                         # the «🔬 Исследования» tab and the evidence it reads
      main_surfaces_enabled: false          # research lines on /btc, /catchup, the briefing, /levels, /risk,
                                            # alerts and pushes (PRE_BETA_SCOPE_DECISION_V1 §6.1: off)
      feeds_enabled: true                   # --beta-feeds-once (every 5 min)
      stress_hours_enabled: true            # --beta-stress-once (hourly; aggTrades of stress hours only)
      main_surface_max: 2                   # research conclusions on a main surface while it is on
  # Level race at structural first touches (FORECAST_LAYER_DECISION_V1 §6a; beta/level_race_live.py).
  # Day 0 is HIST: the 2020-2024 shares of the event's cell beside B0, prices only. Day-0 values (3b, ОПГ-1).
  level_race:
    journal_enabled: true                   # L2_LEVEL_RACE_HIST_{T0,T15}_4H at every landmark, shown or not
    display_enabled: true                   # the T15 HIST line in /levels and /check
    model_states_enabled: false             # HIST -> model states: one dated switch; inert until a model is frozen
    push_trigger: structural                # level-touch push: legacy (exact price) | structural (#352 zone entry
                                            # at the 5m close, with the T0 race line instead of the hold history)
