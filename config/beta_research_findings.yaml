# Research findings the bot shows (PRODUCT_DECISION_V2 §2.4; beta/research_link.py).
#
# One entry per closed research unit, in trader language. A text states only what its record
# states, with its own numbers; it never turns a result into a trade call. `contexts` are the
# places where the bot adds one «Проверено: …» line (the lowest `priority` wins):
#   label:<key> / label:<1h|4h>:<key>   the 1h / 4h state label (beta/interpretation.py keys)
#   level / level:<kind>                a level alert (PDH, PWL, …)
#   event:<kind>                        today's events and the event reminder (CPI, FOMC, EXPIRY_*)
#   move                                the sharp 15-minute move alert
#   corridor                            /risk
#   weekend                             today's block on a Saturday or Sunday (Kyiv)
# Every entry is listed in /research by status. `pending_merge: true` marks a unit whose record
# lives on a research branch that is not merged yet (its record path is checked once it is).
# When a research unit closes, add or update its entry here (AGENTS.md). A closed program with
# nothing to state (no executed unit, no outcome) gets no finding and no /research line; it is
# listed under `no_bot_context` with its record, so the omission is a recorded decision.
version: BETA_RESEARCH_FINDINGS_V1
no_bot_context:
  - program: AUTOGEN_G01
    status: CLOSED_NO_SURVIVORS
    bot_context: NONE
    reason: "0 frozen, 0 executed, no market outcome opened, no product implication; G01-B1 is only a future candidate"
    record: "docs/research/AUTOGEN_G01_DECISION.md; docs/research/AUTOGEN_G01_FEASIBILITY.md"
  - program: DIRECTIONAL_HYPOTHESES_DH1 (cells L1, L3, B1, B2)
    status: CLOSED_AT_FEASIBILITY
    bot_context: NONE
    reason: "closed outcome-blind (INFORMATIONALLY_WEAK; B1 degenerate as defined); no outcome computed, nothing to state. DH1-L2 is listed as a finding"
    record: "docs/research/DH1_RESULT.md; docs/research/DH1_FEASIBILITY.md"
findings:
  # ---- replicated on an independent venue ----------------------------------------------------
  - id: D7
    status: CONFIRMED
    text_ru: "после часа, когда цена ушла необычно далеко для своего объёма, следующий час был таким же примерно в 1 из 5 случаев (обычно в 1 из 10); направление не оценивалось"
    text_en: "after an hour in which price moved unusually far for its volume, the next hour was the same kind about 1 time in 5 (usually 1 in 10); direction was not assessed"
    data: "Binance 2020–2024, 4545 таких часов; повтор на BitMEX 2017–2019"
    record: "docs/research/D7_CAMPAIGN_CLOSE_V1.md; docs/research/D7_CONFIRMATORY_PRIMARY_RESULT_V1.md"
    contexts: [move]
    priority: 20
  - id: D2
    status: CONFIRMED
    text_ru: "после дня с очень высокой волатильностью откат против вчерашнего направления за следующие 24 ч был больше обычного (в среднем 4,0% против 2,6%), но это размах в обе стороны: перекоса против тренда нет"
    text_en: "after a very volatile day the next 24h move against the previous direction was larger than usual (4.0% vs 2.6% on average), but it is a wider swing both ways: no tilt against the trend"
    data: "Binance 2020–2024, 163 таких дня из 1791; повтор на BitMEX 2017–2019; разложение по направлению"
    record: "docs/research/discovery_results/D2_DISCOVERY_RESULT.md; docs/research/D2_BITMEX_REPLICATION_CORRECTED_RESULT.md; docs/research/D2_EXCESS_DIRECTION_ALIGNED_PATH_RISK_RESULT.md"
