name: tests

# Fast, hermetic CI for the existing suite: compile + unit tests only. No Docker,
# no secrets, no external network. Mirrors `make qa-check`. An infra-smoke job
# (Dockerised TimescaleDB/Redis) can be added later once it is proven stable.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 is the production/VPS target and the minimum supported version.
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile all sources (same base as `make qa-check`)
        run: python -m compileall -q -x '(\.venv|\.git|__pycache__)' .

      - name: Run test suite
        run: python -m pytest -q -m "not manual"
