name: CI

# FAST PR GATE. The broad test runs happen here, not in the agents' sessions
# (owner, 2026-10-08: «надо сделать так, чтобы основную работу делал
# экшнс»; docs/ORCHESTRATION_V1.md §4):
# - every push to a PR that is ready for review (not a draft) runs the gate,
#   except a PR that changes only Markdown;
# - a newer push cancels the PR's run still in progress;
# - by hand (workflow_dispatch, started on main): suite=gate for a branch
#   (merged with main first, as a pull_request run is), or suite=rc, the
#   release-candidate suite (scripts/ci/rc_suite.txt) on an exact SHA.
# FULL REGRESSION = .github/workflows/full-regression.yml
#   (workflow_dispatch only): python -m pytest -q
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or SHA to test (empty: the ref the run is started on)"
        required: false
        default: ""
      suite:
        description: "gate = fast PR gate (branch merged with main); rc = release-candidate suite on the exact ref"
        required: false
        default: gate
        type: choice
        options: [gate, rc]

run-name: "${{ github.event_name == 'pull_request' && format('PR gate: #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || format('{0}: {1}', inputs.suite, inputs.branch || github.ref_name) }}"

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.branch || github.ref }}-${{ inputs.suite || 'gate' }}
  cancel-in-progress: true

jobs:
  test:
    # A draft PR is still being iterated on: no run until it is ready for review.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The gate takes about 6 min (p90 13 min); a hung run is stopped instead of
    # billing GitHub's 6 h default.
    timeout-minutes: 60
    # V2-H2d (docs/V2_CORRECTNESS_ACCEPTANCE_CONTRACT.md §2.1b): a real
    # PostgreSQL service, health-checked before any test step runs, so
    # tests/storage/test_klines_no_downgrade.py's real ON CONFLICT
    # regressions actually execute here instead of silently skipping.
    services:
      postgres:
        # CI database-parity with the repository-frozen production/dev
        # image (docker-compose.yml, docs/STAGE2_SPEC.md §ux_rq_pending_job,
        # docs/STAGE2_DATA_AUDIT.md): timescale/timescaledb:2.17.2-pg16.
        # Vanilla postgres:16 does not ship the timescaledb extension, so
        # Database.init_stage2_schema() cannot complete --
        # storage/stage2_schema.sql's first statement is
        # `CREATE EXTENSION IF NOT EXISTS timescaledb;`. Pin the exact
        # compose tag PLUS its immutable registry index digest (verified
        # against registry-1.docker.io Docker-Content-Digest for
        # manifests/2.17.2-pg16 -- never a floating latest, never a
        # third-party-quoted digest) so CI and deployment share one
        # PostgreSQL 16 + TimescaleDB 2.17.2 pair. Credentials, port,
        # database name, and health-check are unchanged. Production
        # docker-compose.yml is not modified by this CI-only pin.
        image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Explicitly configuring this (rather than leaving it unset) flips
      # tests/storage/test_klines_no_downgrade.py's own contract: a
      # connection/setup failure becomes a genuine test FAILURE here,
      # never a silent skip -- see that module's own docstring.
      KLINES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
      # Same contract, same already-running postgres service, for V2-H2b's
      # real row-locking/atomicity/restart suite --
      # tests/storage/test_v2_version_switch_readers.py.
      V2_VERSION_SWITCH_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
      # Same contract, same already-running postgres service, for V2-H2c's
      # real as-of/historical-interval/overlap/restart suite --
      # tests/storage/test_v2_instrument_history_readers.py.
      V2_INSTRUMENT_HISTORY_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
      # Same contract, same already-running postgres service, for V2-H3's
      # real atomicity/idempotency/concurrency/restart suite
      # (tests/storage/test_v2_episode_event_transactions.py) and its
      # pre-H3-database-upgrade suite
      # (tests/storage/test_v2_episode_event_id_constraint_upgrade.py).
      V2_EPISODE_EVENT_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
      # The beta PostgreSQL tests (tests/beta) skip without this. A separate database, created below (PRE_BETA_BACKLOG_V1 X6).
      BETA_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_beta_test
      PR_GATE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref) || '' }}
          # B2-06 verify-only reads provenance blobs from ancestor
          # 78d5bdf without checking that commit out as HEAD.
          # Freeze tests also locate historical git objects by ancestry.
          fetch-depth: 0

      - name: Merge main into the checkout (what a pull_request run tests)
        if: github.event_name == 'workflow_dispatch' && inputs.suite != 'rc'
        run: git -c user.name=ci -c user.email=ci@localhost merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Prove TimescaleDB extension is available on the CI service
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              conn = await asyncpg.connect(os.environ["V2_EPISODE_EVENT_TEST_DSN"])
              await conn.execute("CREATE EXTENSION IF NOT EXISTS timescaledb")
              row = await conn.fetchrow(
                  "SELECT extname, extversion FROM pg_extension"
                  " WHERE extname = 'timescaledb'"
              )
              assert row is not None, "timescaledb extension missing after CREATE EXTENSION"
              pg_version = await conn.fetchval("SHOW server_version")
              print(
                  f"TimescaleDB {row['extversion']} available "
                  f"(PostgreSQL {pg_version})"
              )
              await conn.close()

          asyncio.run(main())
          PY

      - name: Create the beta test database
        # BETA_TEST_DSN gets its own database: the beta fixtures drop and
        # recreate the public schema, which would also remove the other
        # suites' tables and the timescaledb extension in signalbot_test.
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              conn = await asyncpg.connect(os.environ["V2_EPISODE_EVENT_TEST_DSN"])
              await conn.execute("CREATE DATABASE signalbot_beta_test")
              await conn.close()

          asyncio.run(main())
          PY

      - name: Fast PR gate
        if: github.event_name == 'pull_request' || inputs.suite != 'rc'
        run: python scripts/ci/pr_gate.py

      - name: Release-candidate suite (scripts/ci/rc_suite.txt)
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'rc'
        run: |
          echo "RC SHA: $(git rev-parse HEAD)"
          python -m compileall -q .
          python -m pytest -q -rfEs $(grep -v '^#' scripts/ci/rc_suite.txt | grep -v '^$')
