name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # V2-H2d (docs/V2_CORRECTNESS_ACCEPTANCE_CONTRACT.md §2.1b): a real
    # PostgreSQL service, health-checked before any test step runs, so
    # tests/storage/test_klines_no_downgrade.py's real ON CONFLICT
    # regressions actually execute here instead of silently skipping.
    services:
      postgres:
        # CI database-parity with the repository-frozen production/dev
        # image (docker-compose.yml, docs/STAGE2_SPEC.md §ux_rq_pending_job,
        # docs/STAGE2_DATA_AUDIT.md): timescale/timescaledb:2.17.2-pg16.
        # Vanilla postgres:16 does not ship the timescaledb extension, so
        # Database.init_stage2_schema() cannot complete --
        # storage/stage2_schema.sql's first statement is
        # `CREATE EXTENSION IF NOT EXISTS timescaledb;`. Pin the exact
        # compose tag (never a floating latest) so CI and deployment share
        # one PostgreSQL 16 + TimescaleDB 2.17.2 pair. Credentials, port,
        # database name, and health-check are unchanged.
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Explicitly configuring this (rather than leaving it unset) flips
      # tests/storage/test_klines_no_downgrade.py's own contract: a
      # connection/setup failure becomes a genuine test FAILURE here,
      # never a silent skip -- see that module's own docstring.
      KLINES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
      # Same contract, same already-running postgres service, for V2-H2b's
      # real row-locking/atomicity/restart suite --
      # tests/storage/test_v2_version_switch_readers.py.
      V2_VERSION_SWITCH_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
      # Same contract, same already-running postgres service, for V2-H2c's
      # real as-of/historical-interval/overlap/restart suite --
      # tests/storage/test_v2_instrument_history_readers.py.
      V2_INSTRUMENT_HISTORY_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
      # Same contract, same already-running postgres service, for V2-H3's
      # real atomicity/idempotency/concurrency/restart suite
      # (tests/storage/test_v2_episode_event_transactions.py) and its
      # pre-H3-database-upgrade suite
      # (tests/storage/test_v2_episode_event_id_constraint_upgrade.py).
      V2_EPISODE_EVENT_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (syntax)
        run: python -m compileall -q .

      - name: Prove TimescaleDB extension is available on the CI service
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/signalbot_test"
              )
              await conn.execute("CREATE EXTENSION IF NOT EXISTS timescaledb")
              row = await conn.fetchrow(
                  "SELECT extname, extversion FROM pg_extension"
                  " WHERE extname = 'timescaledb'"
              )
              assert row is not None, "timescaledb extension missing after CREATE EXTENSION"
              pg_version = await conn.fetchval("SHOW server_version")
              print(
                  f"TimescaleDB {row['extversion']} available "
                  f"(PostgreSQL {pg_version})"
              )
              await conn.close()

          asyncio.run(main())
          PY

      - name: Full test suite
        run: python -m pytest -q

      - name: V2-H2d raw-kline no-downgrade (real PostgreSQL, explicit)
        run: python -m pytest -q tests/storage/test_klines_no_downgrade.py -v

      - name: V2-H2b DRAIN-BEFORE-ACTIVATE version switch (real PostgreSQL, explicit)
        run: python -m pytest -q tests/storage/test_v2_version_switch_readers.py -v

      - name: V2-H2c as-of instrument metadata (real PostgreSQL, explicit)
        run: python -m pytest -q tests/storage/test_v2_instrument_history_readers.py -v

      - name: V2-H3 atomic/idempotent episode-event persistence (real PostgreSQL, explicit)
        run: python -m pytest -q tests/storage/test_v2_episode_event_transactions.py -v

      - name: V2-H3 pre-H3 database upgrade to hash-format ID constraints (real PostgreSQL, explicit)
        run: python -m pytest -q tests/storage/test_v2_episode_event_id_constraint_upgrade.py -v

      - name: V2 rules/manifest integrity (focused)
        run: python -m pytest -q tests/analytics/test_forecasting_v2_rules_manifest.py tests/analytics/test_forecasting_v2_family_quality.py

      - name: V2-H2a/H2b provenance/readiness/version-switch (focused)
        run: >
          python -m pytest -q
          tests/analytics/test_forecasting_v2_activation_readiness.py
          tests/analytics/test_forecasting_v2_ports.py
          tests/analytics/test_forecasting_v2_version_switch.py
          tests/analytics/test_forecasting_v2_version_switch_orchestrator.py
          tests/storage/test_v2_version_switch_schema.py
          tests/storage/test_v2_instrument_history_schema.py
          tests/storage/test_v2_setup_readers.py
          tests/storage/test_stage2_db.py

      - name: V2 Stage 4/5 detectors (focused)
        run: >
          python -m pytest -q
          tests/analytics/test_forecasting_v2_regime_4h.py
          tests/analytics/test_forecasting_v2_bias_1h.py
          tests/analytics/test_forecasting_v2_context_snapshot.py
          tests/analytics/test_forecasting_v2_setup_common.py
          tests/analytics/test_forecasting_v2_trend_pullback.py
          tests/analytics/test_forecasting_v2_trend_pullback_inputs.py
          tests/analytics/test_forecasting_v2_compression_breakout.py
          tests/analytics/test_forecasting_v2_compression_breakout_inputs.py
          tests/analytics/test_forecasting_v2_confirmed_breakout.py
          tests/analytics/test_forecasting_v2_confirmed_breakout_inputs.py
