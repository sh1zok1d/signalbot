name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # V2-H2d (docs/V2_CORRECTNESS_ACCEPTANCE_CONTRACT.md §2.1b): a real
    # PostgreSQL service, health-checked before any test step runs, so
    # tests/storage/test_klines_no_downgrade.py's real ON CONFLICT
    # regressions actually execute here instead of silently skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Explicitly configuring this (rather than leaving it unset) flips
      # tests/storage/test_klines_no_downgrade.py's own contract: a
      # connection/setup failure becomes a genuine test FAILURE here,
      # never a silent skip -- see that module's own docstring.
      KLINES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/signalbot_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (syntax)
        run: python -m compileall -q .

      - name: Full test suite
        run: python -m pytest -q

      - name: V2-H2d raw-kline no-downgrade (real PostgreSQL, explicit)
        run: python -m pytest -q tests/storage/test_klines_no_downgrade.py -v

      - name: V2 rules/manifest integrity (focused)
        run: python -m pytest -q tests/analytics/test_forecasting_v2_rules_manifest.py tests/analytics/test_forecasting_v2_family_quality.py

      - name: V2 Stage 4/5 detectors (focused)
        run: >
          python -m pytest -q
          tests/analytics/test_forecasting_v2_regime_4h.py
          tests/analytics/test_forecasting_v2_bias_1h.py
          tests/analytics/test_forecasting_v2_context_snapshot.py
          tests/analytics/test_forecasting_v2_setup_common.py
          tests/analytics/test_forecasting_v2_trend_pullback.py
          tests/analytics/test_forecasting_v2_trend_pullback_inputs.py
          tests/analytics/test_forecasting_v2_compression_breakout.py
          tests/analytics/test_forecasting_v2_compression_breakout_inputs.py
          tests/analytics/test_forecasting_v2_confirmed_breakout.py
          tests/analytics/test_forecasting_v2_confirmed_breakout_inputs.py
